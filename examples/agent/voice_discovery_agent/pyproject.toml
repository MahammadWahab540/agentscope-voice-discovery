[project]
name = "voice-discovery-agent"
version = "0.1.0"
description = "Voice Discovery Agent — FastAPI service for real-time voice-based project discovery sessions"
requires-python = ">=3.10"
dependencies = [
    # Web server & framework
    "uvicorn[standard]>=0.29.0",
    "fastapi>=0.111.0",
    # HTTP clients
    "httpx>=0.27.0",
    "requests>=2.31.0",
    # Data validation
    "pydantic>=2.0.0",
    # Environment loading
    "python-dotenv>=1.0.0",
    # Database / ORM
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # Async file I/O
    "aiofiles>=23.0.0",
    # Supabase client
    "supabase>=2.0.0",
    # Google Gemini API
    "google-genai>=1.0.0",
    # WebSocket support (required by agentscope realtime)
    "websockets>=14.0",
    # Audio processing (required by agentscope realtime)
    "scipy>=1.11.0",
    # AgentScope with realtime and Gemini model extras
    "agentscope[realtime,gemini]",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
